<style id="golf-aim-ui-foundation-v2-step1">
/* =========================================================
   GOLF AiM UI Foundation v2 — STEP1
   Design basis: shared GOLF AiM / Shot Log specification v1.0
   Scope: visual tokens + reusable common components only.
   Existing feature logic / localStorage / course calculations are untouched.
   ========================================================= */
:root {
  color-scheme: light;
  --ga-orange: #FF6A24;
  --ga-orange-strong: #E65316;
  --ga-orange-soft: #FFF2EB;
  --ga-blue: #2F6FE4;
  --ga-blue-soft: #EEF4FF;
  --ga-bg: #F8FAFC;
  --ga-card: #FFFFFF;
  --ga-soft: #F1F4F8;
  --ga-border: #DDE3EA;
  --ga-text: #172033;
  --ga-sub: #667085;
  --ga-disabled: #AAB3C0;
  --ga-success: #10B981;
  --ga-warning: #F59E0B;
  --ga-error: #EF4444;
  --ga-info: #3B82F6;
  --ga-radius: 16px;
  --ga-shadow: 0 6px 18px rgba(23, 32, 51, .07);
  --ga-shadow-light: 0 3px 10px rgba(23, 32, 51, .05);
  --ga-header-safe: 47px;
  --ga-header-body: 44px;
  --ga-header-total: 91px;
  --ga-bottom-body: 64px;
  --ga-bottom-safe: 34px;
  --ga-bottom-total: 98px;
}

html, body {
  background: var(--ga-bg) !important;
  color: var(--ga-text) !important;
  font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif !important;
}
body:before { background: var(--ga-bg) !important; }
#root {
  background: var(--ga-bg) !important;
  color: var(--ga-text) !important;
}
#root > div { max-width: 390px !important; }
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgba(47,111,228,.28) !important;
  outline-offset: 2px !important;
}

/* ---------- Reusable common shell ---------- */
.ga-page {
  width: 100%;
  min-height: 100dvh;
  background: var(--ga-bg);
  color: var(--ga-text);
}
.ga-content {
  padding: 16px 16px 28px;
}
.ga-content.has-bottom-nav {
  padding-bottom: calc(var(--ga-bottom-total) + 20px);
}

/* Internal fixed header: 47pt safe area + 44pt body = 91pt */
.ga-header {
  position: sticky;
  top: 0;
  z-index: 70;
  min-height: var(--ga-header-total);
  padding-top: env(safe-area-inset-top, var(--ga-header-safe));
  background: rgba(248,250,252,.96);
  border-bottom: 1px solid var(--ga-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.ga-header__row {
  height: var(--ga-header-body);
  display: grid;
  grid-template-columns: 44px minmax(0,1fr) 44px;
  align-items: center;
  padding: 0 16px;
}
.ga-header__back, .ga-header__action {
  width: 44px;
  height: 44px;
  min-height: 44px;
  display: inline-grid;
  place-items: center;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ga-text);
}
.ga-header__title {
  min-width: 0;
  text-align: center;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--ga-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ga-header__meta {
  text-align: right;
  font-size: 16px;
  line-height: 1;
  font-weight: 600;
  color: var(--ga-sub);
}

/* Cards */
.ga-card {
  background: var(--ga-card);
  color: var(--ga-text);
  border: 0;
  border-radius: var(--ga-radius);
  box-shadow: var(--ga-shadow-light);
  padding: 16px;
}
.ga-card + .ga-card { margin-top: 16px; }
.ga-card--selected {
  border: 1px solid var(--ga-orange);
  background: var(--ga-orange-soft);
}
.ga-card__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ga-text);
}
.ga-card__sub {
  font-size: 13px;
  font-weight: 400;
  color: var(--ga-sub);
}

/* Buttons */
.ga-btn {
  width: 100%;
  min-height: 48px;
  border-radius: var(--ga-radius);
  border: 1px solid transparent;
  padding: 12px 16px;
  font-weight: 700;
  line-height: 1.2;
  transition: transform .12s ease, opacity .12s ease, background .12s ease;
}
.ga-btn:active { transform: scale(.985); }
.ga-btn--primary {
  border-radius: 999px;
  background: var(--ga-orange);
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,106,36,.18);
}
.ga-btn--secondary {
  background: var(--ga-card);
  color: var(--ga-blue);
  border-color: var(--ga-blue);
}
.ga-btn--ghost {
  background: var(--ga-soft);
  color: var(--ga-sub);
  border-color: transparent;
}
.ga-btn--danger {
  background: #FFF5F5;
  color: var(--ga-error);
  border-color: rgba(239,68,68,.45);
}
.ga-btn:disabled {
  background: var(--ga-soft);
  color: var(--ga-disabled);
  box-shadow: none;
}

/* Selectable chips / grid buttons */
.ga-choice {
  min-height: 44px;
  border: 1px solid var(--ga-border);
  border-radius: 12px;
  background: var(--ga-card);
  color: var(--ga-text);
  font-weight: 600;
  padding: 9px 10px;
}
.ga-choice[aria-pressed="true"], .ga-choice.is-selected {
  border-color: var(--ga-orange);
  background: var(--ga-orange);
  color: #fff;
}

/* Fixed bottom nav: 64pt body + 34pt safe area = 98pt */
.ga-bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 65;
  width: min(100%, 390px);
  height: calc(var(--ga-bottom-body) + env(safe-area-inset-bottom, var(--ga-bottom-safe)));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, var(--ga-bottom-safe));
  background: rgba(255,255,255,.97);
  border-top: 1px solid var(--ga-border);
  box-shadow: 0 -4px 14px rgba(23,32,51,.05);
}
.ga-bottom-nav__item {
  position: relative;
  min-height: var(--ga-bottom-body);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--ga-disabled);
  font-size: 11px;
  font-weight: 600;
}
.ga-bottom-nav__item svg { width: 24px; height: 24px; }
.ga-bottom-nav__item.is-active { color: var(--ga-orange); }
.ga-bottom-nav__item.is-active:after {
  content: "";
  position: absolute;
  bottom: 4px;
  width: 24px;
  height: 3px;
  border-radius: 999px;
  background: var(--ga-orange);
}

/* Modal foundation */
.ga-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(23,32,51,.45);
}
.ga-modal {
  width: min(100%, 358px);
  background: var(--ga-card);
  color: var(--ga-text);
  border-radius: 20px;
  box-shadow: 0 22px 60px rgba(23,32,51,.22);
  padding: 24px 20px 20px;
}
.ga-modal__title {
  margin: 0 0 8px;
  text-align: center;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 800;
}
.ga-modal__text {
  margin: 0 0 20px;
  text-align: center;
  color: var(--ga-sub);
  font-size: 13px;
  line-height: 1.6;
}
.ga-modal__actions { display: grid; gap: 10px; }

/* ---------- Bridge existing UI to the new visual foundation ---------- */
.aim-home,
.aim-terrain,
.aim-history,
.aim-analysis { color: var(--ga-text) !important; }
.aim-brand h1 { color: var(--ga-text) !important; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif !important; font-weight: 800 !important; }
.aim-brand p,
.aim-home footer,
.aim-hint,
.aim-analysis-intro { color: var(--ga-sub) !important; }

.aim-mode,
.aim-utilities button,
.aim-review,
.aim-analysis-card,
.aim-history button,
.aim-landing-preview,
.aim-shot-review {
  background: var(--ga-card) !important;
  color: var(--ga-text) !important;
  border: 0 !important;
  border-radius: var(--ga-radius) !important;
  box-shadow: var(--ga-shadow-light) !important;
}
.aim-mode { overflow: hidden; }
.aim-mode small,
.aim-review small,
.aim-analysis-note { color: var(--ga-sub) !important; }

.aim-utilities button { min-height: 48px; }
.aim-segment button,
.aim-clubs button,
.aim-mini-adjust button,
.aim-preview-heading button {
  background: var(--ga-card) !important;
  color: var(--ga-text) !important;
  border: 1px solid var(--ga-border) !important;
  border-radius: 12px !important;
}
.aim-segment button[aria-pressed=true],
.aim-clubs button[aria-pressed=true] {
  background: var(--ga-orange) !important;
  border-color: var(--ga-orange) !important;
  color: #fff !important;
}

.aim-primary {
  background: var(--ga-orange) !important;
  border: 0 !important;
  color: #fff !important;
  border-radius: 999px !important;
  box-shadow: 0 4px 12px rgba(255,106,36,.18) !important;
}
.aim-plan,
.aim-situation {
  background: var(--ga-card) !important;
  color: var(--ga-text) !important;
  border: 0 !important;
  border-radius: var(--ga-radius) !important;
  box-shadow: var(--ga-shadow-light) !important;
}
.aim-situation p,
.aim-plan label { color: var(--ga-text) !important; }

.aim-progress span { background: var(--ga-border) !important; }
.aim-progress span.active { background: var(--ga-orange) !important; }

.aim-analysis-tabs button {
  background: var(--ga-card) !important;
  color: var(--ga-text) !important;
  border: 1px solid var(--ga-border) !important;
  border-radius: 12px !important;
}
.aim-analysis-tabs button[aria-pressed=true] {
  background: var(--ga-orange) !important;
  color: #fff !important;
  border-color: var(--ga-orange) !important;
}
.aim-stat-grid > div,
.aim-direction > div { background: var(--ga-soft) !important; }

/* Existing quit UI receives the common modal visual treatment without changing behavior. */
.aim-quit-open {
  background: var(--ga-card) !important;
  color: var(--ga-blue) !important;
  border: 1px solid var(--ga-blue) !important;
  box-shadow: var(--ga-shadow) !important;
}
.aim-quit-panel {
  left: 50% !important;
  top: 50% !important;
  bottom: auto !important;
  transform: translate(-50%,-50%) !important;
  width: min(calc(100vw - 40px), 358px) !important;
  padding: 24px 20px 20px !important;
  background: var(--ga-card) !important;
  color: var(--ga-text) !important;
  border-radius: 20px !important;
  box-shadow: 0 0 0 100vmax rgba(23,32,51,.45), 0 22px 60px rgba(23,32,51,.22) !important;
}
.aim-quit-panel h3 { text-align: center; font-size: 20px !important; margin-bottom: 16px !important; }
.aim-quit-panel button {
  min-height: 48px !important;
  margin: 10px 0 !important;
  padding: 12px 14px !important;
  border-radius: 16px !important;
  background: var(--ga-soft) !important;
  color: var(--ga-text) !important;
  border: 1px solid transparent !important;
}
.aim-quit-panel button:first-of-type {
  background: var(--ga-orange) !important;
  color: #fff !important;
  border-radius: 999px !important;
}
.aim-quit-panel .aim-discard {
  background: #FFF5F5 !important;
  color: var(--ga-error) !important;
  border-color: rgba(239,68,68,.4) !important;
}

/* Keep course surfaces green; UI around them follows the shared system. */
.aim-course,
.aim-map-v2,
.aim-mini-svg { border-radius: var(--ga-radius) !important; }

@media (min-width: 600px) {
  #root > div { box-shadow: 0 0 0 1px rgba(221,227,234,.65); }
}
</style>

.ga-howto-data{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:16px;margin-top:18px;background:#EEF4FF;}

.ga-howto-data p{margin:5px 0 0;color:var(--ga-sub);font-size:10px;line-height:1.65;font-weight:600;}

.ga-howto-closing strong{display:block;color:var(--ga-orange);font-size:14px;line-height:1.55;font-weight:900;}

<style id="golf-aim-home-v2-step2">
/* =========================================================
   GOLF AiM v2 — STEP2.4
   Home refinement: true fixed hero header + overscroll lock.
   iPhone 14 base: 390 x 844pt.
   ========================================================= */
/* Home owns its own safe-area spacing; remove the legacy root padding only while home is mounted. */
#root:has(.ga-home-v2){padding-top:0!important;padding-bottom:0!important;}
body:has(.ga-home-v2){overflow-x:hidden;overscroll-behavior-y:none;}
.ga-home-v2{
  position:relative;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  padding:158px 16px calc(var(--ga-bottom-total) + 26px);
  overflow:visible;
  background:var(--ga-bg);
  color:var(--ga-text);
  box-sizing:border-box;
}
.ga-home-hero{
  position:fixed;
  top:0;
  left:50%;
  z-index:55;
  width:min(100vw,390px);
  min-height:158px;
  margin:0;
  transform:translateX(-50%);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 20px 4px;
  overflow:hidden;
  background:var(--ga-bg);
  border-bottom:1px solid var(--ga-border);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-sizing:border-box;
}
.ga-home-brand{position:relative;z-index:2;padding-top:3px;}
.ga-home-logo{display:flex;align-items:baseline;gap:6px;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:34px;line-height:1;font-weight:850;letter-spacing:-1.8px;color:#10233D;}
.ga-home-logo .aim{color:var(--ga-orange);font-style:italic;font-weight:850;}
.ga-home-tagline{margin:8px 0 0;color:#7B879B;font-size:13px;font-weight:700;letter-spacing:.02em;}
.ga-home-howto{
  position:absolute;
  z-index:2;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:20px;
  min-width:72px;
  height:34px;
  padding:0 16px;
  border:0;
  border-radius:999px;
  background:#EEF4FF;
  color:var(--ga-blue);
  font-size:12px;
  font-weight:800;
  line-height:34px;
  text-align:center;
  box-shadow:none;
}
.ga-home-practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.ga-home-tile{position:relative;min-width:0;min-height:216px;padding:18px 15px 16px;border:0;border-radius:22px;text-align:left;overflow:hidden;box-shadow:0 7px 22px rgba(23,32,51,.065);transition:transform .12s ease,box-shadow .12s ease;}
.ga-home-tile:active{transform:scale(.985);}
.ga-home-tile--random{background:var(--ga-orange);}
.ga-home-tile--course{background:var(--ga-blue);}
.ga-home-icon-circle{position:relative;z-index:2;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:transparent;color:#fff;box-shadow:none;}
.ga-home-tile .ga-arrow{position:absolute;z-index:2;right:14px;top:18px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:27px;font-weight:400;line-height:1;}
.ga-home-tile--random .ga-arrow,.ga-home-tile--course .ga-arrow{color:#fff;background:rgba(255,255,255,.20);}
.ga-home-tile h2{position:relative;z-index:2;margin:17px 0 7px;font-size:20px;line-height:1.25;font-weight:800;color:#fff;letter-spacing:-.02em;white-space:nowrap;}
.ga-home-tile p{position:relative;z-index:2;margin:0;max-width:145px;color:rgba(255,255,255,.92);font-size:12px;line-height:1.6;font-weight:550;}
.ga-home-secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.ga-home-small-card{position:relative;min-width:0;min-height:140px;padding:17px 15px;border:0;border-radius:20px;background:#fff;text-align:left;box-shadow:0 6px 18px rgba(23,32,51,.055);}
.ga-home-small-card--data{background:#EEF4FF;}
.ga-home-small-card--settings{background:linear-gradient(145deg,#FFFFFF,#F5F7FA);}
.ga-home-small-card .ga-arrow{position:absolute;right:14px;top:20px;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:var(--ga-soft);color:#63738A;font-size:23px;}
.ga-home-small-card--data .ga-arrow{color:var(--ga-blue);background:rgba(47,111,228,.22);}
.ga-home-small-card h3{margin:12px 0 5px;font-size:18px;font-weight:800;color:#12243F;}
.ga-home-small-card p{margin:0;color:#7A879A;font-size:11.5px;line-height:1.55;}
.ga-home-small-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#F6F8FB;color:#63738A;}
.ga-home-small-card--data .ga-home-small-icon{background:#DCE8FF;color:var(--ga-blue);}
.ga-home-recent{width:100%;margin-top:12px;padding:15px 16px 16px;border:0;border-radius:20px;background:#fff;text-align:left;box-shadow:0 6px 18px rgba(23,32,51,.055);}
.ga-home-recent--empty{cursor:default;}
.ga-home-recent-empty{display:flex;align-items:center;gap:12px;padding:2px 0 1px;color:#7E8AA0;}
.ga-home-recent-empty-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:50%;background:#F1F4F8;color:#8B98AA;}
.ga-home-recent-empty strong{display:block;margin-bottom:3px;color:#526176;font-size:13px;}

.ga-home-recent-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#12243F;}

.ga-home-recent-date{margin-left:auto;color:#7E8AA0;font-size:11px;font-weight:600;}
.ga-home-recent-chevron{color:#7E8AA0;font-size:22px;line-height:1;}
.ga-home-recent-mode{display:flex;align-items:baseline;gap:8px;margin-bottom:13px;}
.ga-home-recent-mode strong{font-size:15px;color:#12243F;}
.ga-home-recent-mode span{font-size:11px;color:#7D899D;font-weight:700;}
.ga-home-recent-stats{display:grid;grid-template-columns:repeat(3,1fr);}
.ga-home-recent-stat{min-width:0;padding:0 11px;}
.ga-home-recent-stat:first-child{padding-left:0;}
.ga-home-recent-stat+.ga-home-recent-stat{border-left:1px solid var(--ga-border);}
.ga-home-recent-stat small{display:block;min-height:28px;color:#8390A3;font-size:10px;line-height:1.35;font-weight:650;}
.ga-home-recent-stat b{display:inline-block;margin-top:2px;color:#12243F;font:800 23px/1 Inter,-apple-system,sans-serif;letter-spacing:-.04em;}
.ga-home-recent-stat b.success{color:#12B886;}
.ga-home-recent-stat em{margin-left:3px;color:#7D899D;font-size:11px;font-style:normal;font-weight:650;}
.ga-home-v2 .ga-bottom-nav{z-index:80;}
.ga-home-v2 .ga-bottom-nav__item{border:0;background:transparent;padding:6px 0 9px;}
.ga-home-v2 .ga-bottom-nav__item svg{display:block;}
.ga-home-v2 .ga-bottom-nav__item.is-active:after{bottom:3px;}

  .ga-home-logo{font-size:39px}.ga-home-practice-grid,.ga-home-secondary-grid{gap:9px}.ga-home-tile{padding-left:12px;padding-right:12px}.ga-home-tile h2{font-size:18px}.ga-home-tile p{font-size:11px}.ga-home-recent-stat{padding:0 8px}
}

function gaTopValue(items,fallback='—'){

}

   const err=Number(key==='distance'?x.distanceError:x.lateralError);
   let tol=Number(key==='distance'?x.distanceTolerance:x.lateralTolerance);
   if((!Number.isFinite(tol)||tol<=0)&&Number.isFinite(Number(x.targetDistance))){

     tol=Number(key==='distance'?t.distanceTolerance:t.lateralTolerance);

   return err/tol;
 }).filter(Number.isFinite);

 const avg=rows.reduce(function(a,b){return a+b},0)/rows.length;
 return Math.round(gaRandomClamp(100-50*avg));

function gaRandomTopPair(shots){

 (shots||[]).forEach(function(x){

mp=function({hole,current,holeIdx,totalHoles,completedHoles=[]}){
 const doneScore=completedHoles.reduce((sum,h)=>sum+(Number(h.total)||0),0);
 const donePar=completedHoles.reduce((sum,h)=>sum+(Number(h.par)||0),0);
 const diff=doneScore-donePar;
 const score=completedHoles.length?aimScoreText(diff):'E';
 const pin=(current.pinLabel||hole.pinLabel||((hole.features||[]).find(f=>/ピン/.test(f.text||''))?.text||'—')).replace(/^ピン[:：]?\s*/,'');
 const gw=Math.round((hole.green?.halfWidth||0)*2),gd=Math.round((hole.green?.depth||0)*2);
 return AH('div',{className:'ga-course-fixed'},
   AH('div',{className:'ga-course-topbar'},
     AH('h1',null,'コース想定モード'),

dp=function(props){

 P.useEffect(()=>setViewMode('normal'),[h.number]);
 const overview=viewMode==='overview',greenZoom=viewMode==='green';
 const effectiveShotNo=(h.strokes||0)+(h.penalty||0)+1;
 const shotLabel=h.strokes===0&&h.penalty===0?'ティーショット':`${effectiveShotNo}打目・${h.lie}`;
 return AH(P.Fragment,null,
   AH('section',{className:`ga-course-map-card ga-course-par${h.par}${greenZoom?' ga-course-zoom':''}${overview?' ga-course-overview':''}`},
     AH('div',{className:'ga-course-map-toolbar'},

bp=function({current,isLastHole,onNext,completedHoles=[]}){
 const putts=current.expectedPutts??2;
 const holeTotal=Math.round(current.strokes+current.penalty+putts);
 const holeDiff=holeTotal-current.par;
 const doneScore=completedHoles.reduce((sum,h)=>sum+(Number(h.total)||0),0);
 const donePar=completedHoles.reduce((sum,h)=>sum+(Number(h.par)||0),0);
 const cumScore=doneScore+holeTotal;
 const cumPar=donePar+current.par;
 const cumDiff=cumScore-cumPar;
 const diffText=holeDiff===0?'E':holeDiff>0?`+${holeDiff}`:`${holeDiff}`;
 const greenM=Number.isFinite(current.remainingAtGreenM)?current.remainingAtGreenM:null;
 return AH('main',{className:'ga-course-hole-finish'},
   AH('header',{className:'ga-course-hole-finish-head'},
     AH('h1',null,'ホール結果'),
     AH('span',null,`HOLE ${current.number}`)
   ),
   AH('section',{className:'ga-hole-finish-score'},
     AH('small',null,`PAR ${current.par}`),
     AH('div',{className:'hole-line'},`HOLE ${current.number}`),
     AH('strong',null,holeTotal,AH('em',null,diffText)),
     AH('p',null,'グリーンオン後は想定パットを含めてスコア計算')
   ),
   AH('section',{className:'ga-hole-finish-metrics'},
     AH('div',{className:'ga-hole-finish-metric'},
       AH('small',null,'想定パット'),
       AH('strong',null,Number(putts).toFixed(2))
     ),
     AH('div',{className:'ga-hole-finish-metric'},
       AH('small',null,'グリーンオン残り'),
       AH('strong',null,greenM===null?'—':greenM.toFixed(1),greenM===null?null:AH('em',null,'m'))
     )
   ),
   AH('section',{className:'ga-hole-finish-cumulative'},
     AH('h2',null,'ここまでのスコア'),
     AH('div',{className:'ga-hole-finish-cumulative-row'},
       AH('span',null,`${completedHoles.length+1}H終了`),
       AH('strong',null,`${cumScore}打 / ${aimScoreText(cumDiff)}`)
     ),
     current.penalty>0?AH('div',{className:'ga-hole-finish-penalty'},`ペナルティ ${current.penalty}打を含みます`):null
   ),
   AH('button',{type:'button',className:'ga-hole-finish-next',onClick:onNext},
     isLastHole?'ラウンド結果を見る':'次のホールへ'
   )
 );
};

function gaDataCourseDiff(entry){
 const d=Number(entry&&entry.diff);
 if(!Number.isFinite(d))return '—';
 return d===0?'E':(d>0?'+':'')+d;
}

function gaDataDateValue(value){
 const m=String(value||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
 if(!m)return 0;
 const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
 return Number.isFinite(d.getTime())?d.getTime():0;
}
function gaDataMean(values){
 const a=values.filter(Number.isFinite);
 return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null;
}
function gaDataMetricText(value){
 if(!Number.isFinite(value))return '—';
 const v=Math.round(value*10)/10;
 return Number.isInteger(v)?String(v):v.toFixed(1);
}
function gaDataSessionShots(item){
 if(item.kind==='random')return (item.entry.shots||[]).map(function(s){
   const dist=Number(s.distanceError);
   const lat=Number(s.lateralError);
   const success=typeof s.success==='boolean'?s.success:(typeof s.resultSuccess==='boolean'?s.resultSuccess:null);
   return {dist:Number.isFinite(dist)?Math.abs(dist):null,lat:Number.isFinite(lat)?Math.abs(lat):null,success};
 });
 const rows=[];
 (item.entry.holes||[]).forEach(function(h){
   (h.shots||[]).forEach(function(s){
     const ev=s.evaluation||{};
     let dist=Number(ev.distanceError),lat=Number(ev.lateralError);
     if(!Number.isFinite(dist)){
       const target=Number(s.before&&s.before.targetDistance),actual=Number(s.forward);
       if(Number.isFinite(target)&&Number.isFinite(actual))dist=Math.abs(actual-target);
     }
     if(!Number.isFinite(lat)){
       const lateral=Number(s.lateral);
       if(Number.isFinite(lateral))lat=Math.abs(lateral);
     }
     const success=typeof ev.success==='boolean'?ev.success:null;
     rows.push({dist:Number.isFinite(dist)?Math.abs(dist):null,lat:Number.isFinite(lat)?Math.abs(lat):null,success});
   });
 });
 return rows;
}

function GaClubDispersion({shots,club}){
 const pts=(shots||[]).map(aimNormalizeShot);
 const approach=AIM_APPROACH_CLUBS.has(club);
 const W=334,H=228,L=34,R=12,T=14,B=28,pw=W-L-R,ph=H-T-B;
 if(!pts.length)return null;
 const maxLat=Math.max(10,...pts.map(function(p){return Math.abs(Number(p.lateral)||0)}));
 const xLim=Math.max(10,Math.ceil(maxLat*1.15/5)*5);
 const x=function(v){return L+(Math.max(-xLim,Math.min(xLim,v))+xLim)/(xLim*2)*pw};
 let yMin,yMax,yValue;
 if(approach){
   const vals=pts.map(function(p){return Number(p.longitudinal)||0});
   const lim=Math.max(10,Math.ceil(Math.max(5,...vals.map(Math.abs))*1.2/5)*5);
   yMin=-lim;yMax=lim;yValue=function(p){return Number(p.longitudinal)||0};
 }else{
   const vals=pts.map(function(p){return Number(p.forward)||0});
   const min=Math.min(...vals),max=Math.max(...vals),pad=Math.max(8,(max-min)*.18);
   yMin=Math.floor((min-pad)/10)*10;yMax=Math.ceil((max+pad)/10)*10;
   if(yMin===yMax)yMax=yMin+20;
   yValue=function(p){return Number(p.forward)||0};
 }
 const y=function(v){return T+(yMax-Math.max(yMin,Math.min(yMax,v)))/(yMax-yMin||1)*ph};
 const midY=approach?y(0):T+ph/2;
 return AH('div',{className:'ga-club-plot-wrap'},
   AH('svg',{className:'ga-club-plot',viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'ショット分布'},
     AH('rect',{x:L,y:T,width:pw,height:ph,rx:14,fill:'#F6F8FB',stroke:'#DDE3EA'}),
     AH('line',{x1:x(0),y1:T,x2:x(0),y2:T+ph,stroke:'#AAB3C0',strokeWidth:1}),
     AH('line',{x1:L,y1:midY,x2:L+pw,y2:midY,stroke:'#D5DBE3',strokeWidth:1,strokeDasharray:'4 4'}),
     AH('text',{x:L,y:H-7,fill:'#667085',fontSize:9},'左 '+xLim+'yd'),
     AH('text',{x:L+pw,y:H-7,fill:'#667085',fontSize:9,textAnchor:'end'},'右 '+xLim+'yd'),
     AH('text',{x:L+pw/2,y:11,fill:'#667085',fontSize:8,textAnchor:'middle'},approach?'距離誤差':'飛距離'),
     ...pts.map(function(p,i){
       return AH('circle',{key:i,cx:x(Number(p.lateral)||0),cy:y(yValue(p)),r:4.3,fill:p._source==='course'?'#2F6FE4':'#FF6A24',opacity:.86,stroke:'#fff',strokeWidth:1.2});
     })
   ),
   AH('div',{className:'ga-club-plot-legend'},
     AH('span',null,AH('i',{className:'random'}),'ランダム'),
     AH('span',null,AH('i',{className:'course'}),'コース想定')
   )
 );
}

function GaDataDashboard({courseHistory=[],randomHistory=[],clubs=[],onCourseHistory,onRandomHistory,onHome,onPractice,onSettings}){
 const state=P.useState('recent'),tab=state[0],setTab=state[1];
 const selectedState=P.useState(null),selectedClub=selectedState[0],setSelectedClub=selectedState[1];
 gaUseEdgeSwipeBack(onHome,!selectedClub);
 const periodState=P.useState('recent10'),period=periodState[0],setPeriod=periodState[1];
 const completedCourses=(courseHistory||[]).filter(function(x){return x&&!x.incomplete});
 const completedRandom=(randomHistory||[]).filter(function(x){return x&&!x.incomplete});

 const allSessions=[];
 completedCourses.forEach(function(entry,index){allSessions.push({kind:'course',entry,sort:gaDataDateValue(entry.date),order:index})});
 completedRandom.forEach(function(entry,index){allSessions.push({kind:'random',entry,sort:gaDataDateValue(entry.date),order:completedCourses.length+index})});
 allSessions.sort(function(a,b){return (b.sort-a.sort)||(a.order-b.order)});

 let selectedSessions=allSessions;
 if(period==='recent10')selectedSessions=allSessions.slice(0,10);
 if(period==='1m'||period==='3m'){
   const days=period==='1m'?30:90;
   const cutoff=Date.now()-days*24*60*60*1000;
   selectedSessions=allSessions.filter(function(x){return x.sort>=cutoff});
 }
 const selectedSet=new Set(selectedSessions.map(function(x){return x.entry}));
 const filteredRandom=completedRandom.filter(function(x){return selectedSet.has(x)});
 const filteredCourses=completedCourses.filter(function(x){return selectedSet.has(x)});
 const recentRandom=filteredRandom.slice(0,3);
 const recentCourse=filteredCourses.slice(0,3);

 const shotRows=[];
 selectedSessions.forEach(function(item){shotRows.push(...gaDataSessionShots(item))});
 const successRows=shotRows.filter(function(x){return typeof x.success==='boolean'});
 const distanceRows=shotRows.map(function(x){return x.dist}).filter(Number.isFinite);
 const lateralRows=shotRows.map(function(x){return x.lat}).filter(Number.isFinite);
 const successRate=successRows.length?Math.round(successRows.filter(function(x){return x.success}).length/successRows.length*100):null;
 const avgDistance=gaDataMean(distanceRows);
 const avgLateral=gaDataMean(lateralRows);

 const periodShots=aimFlattenShots(filteredCourses,filteredRandom).map(aimNormalizeShot);
 const configuredClubNames=(clubs||[]).map(function(x){return x&&x.name}).filter(Boolean);
 const dataClubNames=[...new Set(periodShots.map(function(x){return x.club}).filter(Boolean))];
 const clubNames=[...new Set(configuredClubNames.concat(dataClubNames))];
 const clubRows=clubNames.map(function(club){
   const rows=periodShots.filter(function(x){return x.club===club});
   const avgForward=gaDataMean(rows.map(function(x){return Number(x.forward)}).filter(Number.isFinite));
   const avgDistError=gaDataMean(rows.map(function(x){return Math.abs(Number(x.longitudinal))}).filter(Number.isFinite));
   const avgLatError=gaDataMean(rows.map(function(x){return Math.abs(Number(x.lateral))}).filter(Number.isFinite));
   return {club,count:rows.length,avgForward,avgDistError,avgLatError};
 });

 const periodControl=AH('div',{className:'ga-data-range','aria-label':'集計期間'},
   ...[['recent10','直近10回'],['1m','1か月'],['3m','3か月'],['all','すべて']].map(function(x){
     return AH('button',{type:'button','aria-pressed':period===x[0],onClick:function(){setPeriod(x[0])},key:x[0]},x[1]);
   })
 );

 if(selectedClub)return AH(GaClubDetailV2,{club:selectedClub,shots:periodShots,period,periodControl,onBack:function(){setSelectedClub(null)}});

 return AH('main',{className:'ga-data-dashboard'},
   AH('header',{className:'ga-data-head'},AH('h1',null,'データ')),
   AH('div',{className:'ga-data-tabs',role:'tablist'},
     AH('button',{type:'button',className:'ga-data-tab',role:'tab','aria-selected':tab==='recent',onClick:function(){setTab('recent')}},'最近の練習'),
     AH('button',{type:'button',className:'ga-data-tab',role:'tab','aria-selected':tab==='club',onClick:function(){setTab('club')}},'クラブ別データ')
   ),
   periodControl,

   tab==='recent'?AH(P.Fragment,null,
     AH('section',{className:'ga-data-overview'},
       AH('div',{className:'ga-data-overview-card'},AH('small',null,'練習回数'),AH('strong',null,selectedSessions.length,AH('em',null,'回'))),
       AH('div',{className:'ga-data-overview-card'},AH('small',null,'成功率'),AH('strong',null,successRate===null?'—':successRate,successRate===null?null:AH('em',null,'%'))),
       AH('div',{className:'ga-data-overview-card'},AH('small',null,'平均距離誤差'),AH('strong',null,gaDataMetricText(avgDistance),Number.isFinite(avgDistance)?AH('em',null,'yd'):null)),
       AH('div',{className:'ga-data-overview-card'},AH('small',null,'平均横ズレ'),AH('strong',null,gaDataMetricText(avgLateral),Number.isFinite(avgLateral)?AH('em',null,'yd'):null))
     ),

     AH('section',{className:'ga-data-section'},
       AH('div',{className:'ga-data-section-title'},AH('h2',null,'ランダムモード'),AH('button',{type:'button',onClick:onRandomHistory},'すべて見る')),
       recentRandom.length?AH('div',{className:'ga-data-list'},...recentRandom.map(function(x,idx){
         return AH('article',{className:'ga-data-session random',key:x.sessionId||idx},
           AH('div',{className:'ga-data-session-top'},AH('div',{className:'ga-data-session-mode'},AH('span',{className:'ga-data-session-dot'}),'ランダム'),AH('span',{className:'ga-data-session-date'},x.date||'—')),
           AH('div',{className:'ga-data-session-main'},AH('span',null,(x.totalShots||0)+'球'),AH('strong',null,(x.success||0)+' / '+(x.totalShots||0)+' 成功')),
           AH('div',{className:'ga-data-session-sub'},'平均距離誤差 '+(x.avgDistanceError??'—')+'yd ・ 平均横ズレ '+(x.avgLateralError??'—')+'yd')
         );
       })):AH('div',{className:'ga-data-empty'},'この期間のランダムモード記録はありません。')
     ),

     AH('section',{className:'ga-data-section'},
       AH('div',{className:'ga-data-section-title'},AH('h2',null,'コース想定'),AH('button',{type:'button',onClick:onCourseHistory},'すべて見る')),
       recentCourse.length?AH('div',{className:'ga-data-list'},...recentCourse.map(function(x,idx){
         return AH('article',{className:'ga-data-session course',key:x.sessionId||idx},
           AH('div',{className:'ga-data-session-top'},AH('div',{className:'ga-data-session-mode'},AH('span',{className:'ga-data-session-dot'}),'コース想定'),AH('span',{className:'ga-data-session-date'},x.date||'—')),
           AH('div',{className:'ga-data-session-main'},AH('span',null,(x.holeCount||((x.holes||[]).length)||0)+'H'),AH('strong',null,(x.totalScore??'—')+' / '+gaDataCourseDiff(x))),
           AH('div',{className:'ga-data-session-sub'},'GIR '+(x.girCount??'—')+' ・ OB '+(x.obTotal??0)+' ・ 池 '+(x.waterTotal??0))
         );
       })):AH('div',{className:'ga-data-empty'},'この期間のコース想定記録はありません。')
     )
   ):AH('section',{className:'ga-data-club-wrap'},
     AH('div',{className:'ga-data-club-head'},
       AH('h2',null,'クラブ別データ'),
       AH('span',null,clubRows.length+' CLUBS')
     ),
     clubRows.length?AH('div',{className:'ga-data-club-list'},...clubRows.map(function(row){
       const hasData=row.count>0;
       return AH('article',{className:'ga-data-club-row'+(hasData?'':' is-empty'),key:row.club,'data-clickable':'true',role:'button',tabIndex:0,onClick:function(){setSelectedClub(row.club)},onKeyDown:function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setSelectedClub(row.club)}}},
         AH('div',{className:'ga-data-club-row-top'},
           AH('strong',null,row.club),
           AH('span',null,row.count+'球')
         ),
         AH('div',{className:'ga-data-club-metrics'},
           AH('div',{className:'ga-data-club-metric'},AH('small',null,'平均飛距離'),AH('strong',null,gaDataMetricText(row.avgForward),Number.isFinite(row.avgForward)?AH('em',null,'yd'):null)),

           AH('div',{className:'ga-data-club-metric'},AH('small',null,'平均横ズレ'),AH('strong',null,gaDataMetricText(row.avgLatError),Number.isFinite(row.avgLatError)?AH('em',null,'yd'):null))
         )
       );
     })):AH('div',{className:'ga-data-empty'},'クラブが登録されていません。'),
     AH('p',{className:'ga-data-club-note'},'クラブをタップすると、期間内のショット分布・距離・方向・ミス傾向を確認できます。')
   ),

   AH(GaBottomNav,{active:'data',onHome,onPractice,onData:function(){setTab('recent')},onSettings})

function gaHistoryRandomMetrics(entry){
 const shots=entry&&Array.isArray(entry.shots)?entry.shots:[];
 const total=Number(entry&&entry.totalShots)||shots.length||0;
 const success=Number.isFinite(Number(entry&&entry.success))?Number(entry.success):shots.filter(function(s){return s&&((s.success===true)||(s.resultSuccess===true))}).length;
 const rate=Number.isFinite(Number(entry&&entry.successRate))?Number(entry.successRate):(total?Math.round(success/total*100):0);
 const dist=Number(entry&&entry.avgDistanceError);
 const lat=Number(entry&&entry.avgLateralError);
 return {
   total:total,
   success:success,
   rate:rate,
   dist:Number.isFinite(dist)?dist:gaDataMean(shots.map(function(s){const n=Number(s&&s.distanceError);return Number.isFinite(n)?Math.abs(n):NaN}).filter(Number.isFinite)),
   lat:Number.isFinite(lat)?lat:gaDataMean(shots.map(function(s){const n=Number(s&&s.lateralError);return Number.isFinite(n)?Math.abs(n):NaN}).filter(Number.isFinite))
 };
}
function gaHistoryCourseMetrics(entry){
 const holes=entry&&Array.isArray(entry.holes)?entry.holes:[];
 const holeCount=Number(entry&&entry.holeCount)||holes.length||0;
 const played=entry&&entry.incomplete?(Number(entry.playedHoles)||holes.length):holeCount;
 const score=Number(entry&&entry.totalScore);
 const par=holes.reduce(function(a,h){return a+(Number(h&&h.par)||0)},0);
 const diff=Number.isFinite(Number(entry&&entry.diff))?Number(entry.diff):(Number.isFinite(score)&&par?score-par:null);
 const gir=Number.isFinite(Number(entry&&entry.girCount))?Number(entry.girCount):holes.filter(function(h){return h&&h.gir}).length;
 const ob=Number.isFinite(Number(entry&&entry.obTotal))?Number(entry.obTotal):holes.reduce(function(a,h){return a+(Number(h&&h.obCount)||0)},0);
 const water=Number.isFinite(Number(entry&&entry.waterTotal))?Number(entry.waterTotal):holes.reduce(function(a,h){return a+(Number(h&&h.waterCount)||0)},0);
 return {holeCount,played,score:Number.isFinite(score)?score:null,diff:Number.isFinite(diff)?diff:null,gir,ob,water};
}

function gaCourseDetailDiff(score,par){
 if(!Number.isFinite(score)||!Number.isFinite(par))return '—';
 const d=score-par;
 return d===0?'E':(d>0?'+':'')+d;
}
function gaCourseDetailDirection(v){
 const n=Number(v);
 if(!Number.isFinite(n))return '—';
 if(Math.abs(n)<.5)return 'センター';
 return (n<0?'左 ':'右 ')+Math.abs(Math.round(n*10)/10)+'yd';
}
function gaCourseDetailQuality(shot){
 const ev=shot&&shot.evaluation||{};
 const tier=ev.shotQualityTier;
 if(tier==='perfect')return {label:'成功',className:' is-good'};
 if(tier==='acceptable')return {label:'許容',className:' is-good'};
 if(tier==='poor')return {label:'大ミス',className:' is-bad'};
 if(tier==='critical')return {label:'致命的',className:' is-bad'};
 if(typeof ev.success==='boolean')return {label:ev.success?'成功':'ミス',className:ev.success?' is-good':' is-bad'};
 return {label:'記録',className:''};
}

function gaStorageRead(key,fallback){
 try{
  const raw=window.localStorage.getItem(key);
  if(!raw)return fallback;
  const parsed=JSON.parse(raw);
  return parsed===null||parsed===undefined?fallback:parsed;
 }catch(e){return fallback}
}
function gaStorageWrite(key,value){
 try{window.localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}
}
function gaFeedbackMakeDefaults(rows){
 return rows.map(function(x){return {id:x[0],label:x[1],enabled:true,custom:false}});
}
function gaFeedbackMergeList(saved,defs,type){
 const base=gaFeedbackMakeDefaults(defs);
 const byId=new Map((Array.isArray(saved)?saved:[]).map(function(x){return [x&&x.id,x]}));
 const byLabel=new Map((Array.isArray(saved)?saved:[]).map(function(x){return [x&&x.label,x]}));
 const merged=base.map(function(x){
  const old=byId.get(x.id)||byLabel.get(x.label);
  return old?{...x,enabled:old.enabled!==false}:x;
 });
 const custom=(Array.isArray(saved)?saved:[]).filter(function(x){
  if(!x||!x.custom||!String(x.label||'').trim())return false;
  return !merged.some(function(d){return d.id===x.id||d.label===x.label});
 }).map(function(x){
  return {id:String(x.id||('custom-'+type+'-'+Date.now())),label:String(x.label).trim(),enabled:x.enabled!==false,custom:true};
 });
 return merged.concat(custom);
}
function gaFeedbackLoadConfig(){
 const saved=gaStorageRead(GA_FEEDBACK_KEY,{});
 return {
  version:1,
  good:gaFeedbackMergeList(saved.good,GA_GOOD_DEFAULTS,'good'),
  miss:gaFeedbackMergeList(saved.miss,GA_MISS_DEFAULTS,'miss')
 };
}
function gaFeedbackSaveConfig(config){
 return gaStorageWrite(GA_FEEDBACK_KEY,{version:1,good:config.good||[],miss:config.miss||[]});
}
function gaFeedbackEnabled(type){
 const cfg=gaFeedbackLoadConfig();
 return (cfg[type]||[]).filter(function(x){return x.enabled!==false}).map(function(x){return x.label});
}
function gaRowsFromLabels(labels,size){
 const rows=[],n=size||3;
 for(let i=0;i<labels.length;i+=n){
  const row=labels.slice(i,i+n);
  while(row.length<n)row.push(null);
  rows.push(row);
 }
 return rows;
}
function gaDailyKey(value){
 const m=String(value||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
 if(!m)return String(value||'');
 return m[1]+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[3])).padStart(2,'0');
}
function gaDailyLabel(key){
 const m=String(key||'').match(/(\d{4})-(\d{2})-(\d{2})/);
 if(!m)return key||'—';
 const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
 const wd=['日','月','火','水','木','金','土'][d.getDay()];
 return Number(m[1])+'/'+Number(m[2])+'/'+Number(m[3])+' ('+wd+')';
}
function gaReflectionLoad(dayKey){
 const map=gaStorageRead(GA_REFLECTION_KEY,{});
 return typeof map[dayKey]==='string'?map[dayKey]:'';
}
function gaReflectionSave(dayKey,textValue){
 const map=gaStorageRead(GA_REFLECTION_KEY,{});
 map[dayKey]=String(textValue||'').trim();
 return gaStorageWrite(GA_REFLECTION_KEY,map);
}
function gaSetDataDeepLink(dayKey){
 try{window.localStorage.setItem(GA_DATA_DEEPLINK_KEY,dayKey)}catch(e){}
}
function gaTakeDataDeepLink(){
 try{
  const v=window.localStorage.getItem(GA_DATA_DEEPLINK_KEY)||'';
  window.localStorage.removeItem(GA_DATA_DEEPLINK_KEY);
  return v;
 }catch(e){return ''}
}

/* Reuse the existing result summary, adding click-to-detail to its shot rows. */
const gaBatchBaseRandomSummary=Dp;

 P.useEffect(function(){
  if(detailIndex!==null)return;
  const root=document.querySelector('.ga-random-summary-page');
  if(!root)return;
  const handle=function(event){
   const row=event.target.closest('.ga-random-preview-row,.ga-random-shot-card');

   if(row.classList.contains('ga-random-preview-row')){

    index=Array.prototype.indexOf.call(root.querySelectorAll('.ga-random-shot-card'),row);
   }
   if(index>=0&&props.session&&Array.isArray(props.session.shots)&&props.session.shots[index])setDetailIndex(index);
  };
  root.addEventListener('click',handle);
  return function(){root.removeEventListener('click',handle)};
 },[detailIndex,props.session]);
 if(detailIndex!==null){
  const shots=props.session&&Array.isArray(props.session.shots)?props.session.shots:[];
  return AH(GaRandomSummaryShotDetail,{
   shot:shots[detailIndex],index:detailIndex,onBack:function(){setDetailIndex(null)}
  });
 }
 return AH(gaBatchBaseRandomSummary,props);
};
