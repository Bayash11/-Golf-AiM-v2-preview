name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1
      - run: npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
          async function dump(label){
            console.log('\n=== '+label+' ===');
            console.log((await page.locator('body').innerText()).slice(0,10000));
            console.log('BUTTONS',JSON.stringify(await page.locator('button').allInnerTexts()));
            console.log('INPUTS',JSON.stringify(await page.locator('input').evaluateAll(xs=>xs.map(x=>({type:x.type,value:x.value,placeholder:x.placeholder,min:x.min,max:x.max})))));
          }
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
          await dump('HOME');
          await page.getByRole('button',{name:/ランダムモード/}).click();
          await page.waitForTimeout(300);
          await dump('RANDOM_SETUP');
          await page.getByRole('button',{name:'戻る'}).click();
          await page.waitForTimeout(200);
          await page.getByRole('button',{name:/コース想定モード/}).click();
          await page.waitForTimeout(300);
          await dump('COURSE_SETUP');
          await browser.close();
          JS
          node qa.mjs
