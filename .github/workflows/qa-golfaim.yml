name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          async function makePage(){
            const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            p.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            await p.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            return p;
          }
          async function dump(page,label){
            console.log('\n=== '+label+' ===');
            console.log((await page.locator('body').innerText()).slice(0,15000));
            console.log('BUTTONS',JSON.stringify(await page.locator('button').allInnerTexts()));
            console.log('INPUTS',JSON.stringify(await page.locator('input').evaluateAll(xs=>xs.map(x=>({type:x.type,value:x.value,placeholder:x.placeholder,min:x.min,max:x.max,step:x.step})))));
          }
          let page=await makePage();
          await page.getByRole('button',{name:/ランダムモード/}).click();
          await page.getByRole('button',{name:'3球'}).click();
          await page.getByRole('button',{name:'練習を開始'}).click();
          await page.waitForTimeout(500);
          await dump(page,'RANDOM_FIRST_SHOT');
          await page.close();

          page=await makePage();
          await page.getByRole('button',{name:/コース想定モード/}).click();
          await page.getByRole('button',{name:/3H/}).click();
          await page.getByRole('button',{name:'コースを開始'}).click();
          await page.waitForTimeout(500);
          await dump(page,'COURSE_FIRST_HOLE');
          await page.close();
          await browser.close();
          JS
          node qa.mjs
