name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await context.addInitScript(() => {
            const clubs=[
              {name:'Dr',typical:220,approach:false},{name:'5W',typical:195,approach:false},
              {name:'3U',typical:190,approach:false},{name:'4U',typical:180,approach:false},
              {name:'5I',typical:165,approach:false},{name:'6I',typical:155,approach:false},
              {name:'7I',typical:145,approach:false},{name:'8I',typical:135,approach:false},
              {name:'9I',typical:120,approach:false},{name:'P',typical:100,approach:false},
              {name:'48°',typical:85,approach:true},{name:'52°',typical:65,approach:true},
              {name:'58°',typical:45,approach:true}
            ];
            localStorage.setItem('golf-aim:priv:club-config',JSON.stringify(clubs));
            localStorage.setItem('golf-aim:priv:skill-level',JSON.stringify('break90'));
            localStorage.setItem('golfAim.shotStyleConfig.v1',JSON.stringify({version:1,items:[
              {id:'style-full',label:'フルショット',enabled:true,custom:false},
              {id:'style-line',label:'ライン出し',enabled:true,custom:false}
            ]}));
            localStorage.setItem('golfAim.feedbackConfig.v1',JSON.stringify({version:1,
              good:[
                {id:'good-swing-through',label:'振り切れた',enabled:true,custom:false},
                {id:'good-posture',label:'前傾維持',enabled:true,custom:false},
                {id:'good-turn',label:'回転できた',enabled:true,custom:false}
              ],
              miss:[
                {id:'miss-fat',label:'ダフリ',enabled:true,custom:false},
                {id:'miss-top',label:'トップ',enabled:true,custom:false},
                {id:'miss-face-open',label:'フェース開いた',enabled:true,custom:false},
                {id:'miss-pull',label:'ひっかけ',enabled:true,custom:false},
                {id:'miss-arms',label:'手打ち',enabled:true,custom:false}
              ]}));
          });
          const page=await context.newPage();
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/ランダムモード/}).click();
          await page.getByRole('button',{name:'3球'}).click();
          await page.getByRole('button',{name:'練習を開始'}).click();
          await page.waitForTimeout(300);
          console.log('=== RANDOM_AIM ===');
          console.log((await page.locator('body').innerText()).slice(0,12000));
          console.log('BUTTONS',JSON.stringify(await page.locator('button').allInnerTexts()));
          const body=await page.locator('body').innerText();
          const clubs=['Dr','5W','3U','4U','5I','6I','7I','8I','9I','P','48°','52°','58°'];
          let chosen=clubs.find(x=>body.split('\n').includes(x))||'7I';
          const cb=page.getByRole('button',{name:chosen,exact:true});
          if(await cb.count()) await cb.first().click();
          const center=page.getByRole('button',{name:'中央',exact:true});
          if(await center.count()) await center.first().click();
          const fade=page.getByRole('button',{name:'フェード',exact:true});
          if(await fade.count()) await fade.first().click();
          const full=page.getByRole('button',{name:'フルショット',exact:true});
          if(await full.count()) await full.first().click();
          await page.getByRole('button',{name:'この狙いで打つ'}).click();
          await page.waitForTimeout(300);
          console.log('=== RANDOM_RESULT_INPUT ===');
          console.log((await page.locator('body').innerText()).slice(0,16000));
          console.log('BUTTONS',JSON.stringify(await page.locator('button').allInnerTexts()));
          console.log('INPUTS',JSON.stringify(await page.locator('input').evaluateAll(xs=>xs.map(x=>({type:x.type,value:x.value,placeholder:x.placeholder,min:x.min,max:x.max,step:x.step,name:x.name})))));
          console.log('SELECTS',JSON.stringify(await page.locator('select').evaluateAll(xs=>xs.map(x=>({value:x.value,options:[...x.options].map(o=>o.text)})))));
          await browser.close();
          JS
          node qa.mjs
