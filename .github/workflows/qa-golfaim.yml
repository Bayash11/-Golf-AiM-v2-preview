name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const BASE='http://127.0.0.1:8000/';
          await page.goto(BASE,{waitUntil:'domcontentloaded'});
          await page.evaluate(()=>{
            const clubs=[{name:'Dr',typical:220,approach:false},{name:'5W',typical:195,approach:false},{name:'3U',typical:190,approach:false},{name:'4U',typical:180,approach:false},{name:'6I',typical:155,approach:false},{name:'7I',typical:145,approach:false},{name:'8I',typical:135,approach:false},{name:'9I',typical:120,approach:false},{name:'P',typical:100,approach:false},{name:'48°',typical:85,approach:true},{name:'52°',typical:65,approach:true},{name:'58°',typical:45,approach:true}];
            localStorage.clear();localStorage.setItem('golf-aim:priv:club-config',JSON.stringify(clubs));
            localStorage.setItem('golf-aim:priv:skill-level',JSON.stringify('break90'));
            localStorage.setItem('golfAim.shotStyleConfig.v1',JSON.stringify({version:1,items:[{id:'style-normal',label:'ノーマル',enabled:true,custom:false}]}));
          });
          await page.goto(BASE,{waitUntil:'domcontentloaded'});
          await page.getByRole('button',{name:/コース想定モード/}).first().click();
          await page.getByRole('button',{name:/3H/}).first().click();
          await page.getByRole('button',{name:/コースを開始/}).first().click();
          await page.waitForTimeout(200);
          const body=await page.locator('body').innerText();
          const rm=body.match(/残り\s*(\d+)yd/); const rem=rm?Number(rm[1]):0;
          const club=rem>200?'Dr':rem>185?'5W':rem>170?'4U':rem>150?'6I':rem>135?'7I':rem>120?'8I':rem>100?'9I':rem>85?'P':rem>60?'48°':rem>45?'52°':'58°';
          console.log('REMAINING',rem,'CLUB',club);
          await page.getByRole('button',{name:club,exact:true}).first().click();
          const svg=page.locator('svg.aim-map-v2');
          const box=await svg.boundingBox();
          console.log('BOX',JSON.stringify(box),'VIEWBOX',await svg.getAttribute('viewBox'));
          for(const frac of [0.10,0.30,0.50,0.70,0.90]){
            await page.mouse.click(box.x+box.width/2,box.y+box.height*frac);
            await page.waitForTimeout(100);
            const txt=await page.locator('body').innerText();
            const m=txt.match(/狙いまでの距離\s*(\d+)yd/);
            console.log('FRAC',frac,'TARGET',m?m[1]:'none');
          }
          console.log('FINAL_BODY\n'+(await page.locator('body').innerText()).slice(0,12000));
          await browser.close();
          JS
          node qa.mjs
