name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          page.setDefaultTimeout(12000);
          const BASE='http://127.0.0.1:8000/';
          await page.goto(BASE,{waitUntil:'domcontentloaded'});
          await page.evaluate(()=>{
            const clubs=[
              {name:'Dr',typical:220,approach:false},{name:'5W',typical:195,approach:false},{name:'3U',typical:190,approach:false},
              {name:'4U',typical:180,approach:false},{name:'6I',typical:155,approach:false},{name:'7I',typical:145,approach:false},
              {name:'8I',typical:135,approach:false},{name:'9I',typical:120,approach:false},{name:'P',typical:100,approach:false},
              {name:'48°',typical:85,approach:true},{name:'52°',typical:65,approach:true},{name:'58°',typical:45,approach:true}
            ];
            localStorage.clear();
            localStorage.setItem('golf-aim:priv:club-config',JSON.stringify(clubs));
            localStorage.setItem('golf-aim:priv:skill-level',JSON.stringify('break90'));
            localStorage.setItem('golfAim.shotStyleConfig.v1',JSON.stringify({version:1,items:[
              {id:'style-normal',label:'ノーマル',enabled:true,custom:false},{id:'style-line',label:'ライン出し',enabled:true,custom:false}
            ]}));
            localStorage.setItem('golfAim.feedbackConfig.v1',JSON.stringify({version:1,good:[
              {id:'good-swing-through',label:'振り切れた',enabled:true,custom:false},{id:'good-tempo',label:'テンポ○',enabled:true,custom:false}
            ],miss:[
              {id:'miss-fat',label:'ダフリ',enabled:true,custom:false},{id:'miss-top',label:'トップ',enabled:true,custom:false},
              {id:'miss-face-open',label:'フェース開いた',enabled:true,custom:false},{id:'miss-pull',label:'ひっかけ',enabled:true,custom:false}
            ]}));
          });
          const clubs=[['Dr',220],['5W',195],['3U',190],['4U',180],['6I',155],['7I',145],['8I',135],['9I',120],['P',100],['48°',85],['52°',65],['58°',45]];
          const nearestClub=t=>clubs.slice().sort((a,b)=>Math.abs(a[1]-t)-Math.abs(b[1]-t))[0][0];
          async function clickIf(name){
            const b=page.getByRole('button',{name,exact:true});
            if(await b.count()){await b.first().click();return true} return false;
          }
          async function homeAndStart(){
            await page.goto(BASE,{waitUntil:'domcontentloaded'});
            await page.waitForSelector('.ga-home',{timeout:12000}).catch(()=>{});
            await page.getByRole('button',{name:/ランダムモード/}).first().click();
            await page.waitForSelector('.ga-random-setup');
            await page.getByRole('button',{name:'10球',exact:true}).click();
            await page.getByRole('button',{name:/練習を開始/}).first().click();
            await page.waitForSelector('.ga-random-aim');
          }
          async function playShot(i){
            const txt=await page.locator('body').innerText();
            const m=txt.match(/今回の距離\s*(\d+)yd/);
            if(!m) throw new Error('target missing on shot '+i);
            const target=Number(m[1]),club=nearestClub(target);
            await clickIf(club);
            let dir='中央';
            if(/OB（左）|池（左）/.test(txt))dir='右';
            else if(/OB（右）|池（右）/.test(txt))dir='左';
            await clickIf(dir); await clickIf('フェード'); await clickIf(i%4===0?'ライン出し':'ノーマル');
            await page.getByRole('button',{name:'この狙いで打つ',exact:true}).click();
            await page.waitForSelector('.ga-random-result');

            const p=i%5;
            let ds=0,ls=0,side='右5yd',fb='振り切れた',contact='良い',curve='フェード';
            if(p===1){ds=1;ls=1;fb='テンポ○';contact='普通';}
            if(p===2){ds=-2;ls=2;fb='フェース開いた';contact='ヒール';curve='スライス';}
            if(p===3){ds=-4;ls=3;side='左5yd';fb='トップ';contact='下目';curve='フック';}
            if(p===4){ds=1;ls=1;side='左5yd';fb='振り切れた';contact='良い';}
            for(let k=0;k<Math.abs(ds);k++) await clickIf(ds<0?'−5yd':'＋5yd');
            for(let k=0;k<ls;k++) await clickIf(side);
            await clickIf(curve); await clickIf(contact); await clickIf(fb);
            await page.getByRole('button',{name:/^記録して/}).first().click();
            await page.waitForTimeout(80);
            console.log('RSHOT',i,'target',target,'club',club,'pattern',p);
          }
          for(let s=1;s<=3;s++){
            await homeAndStart();
            for(let i=1;i<=10;i++)await playShot(i+s);
            await page.waitForTimeout(150);
            console.log('\n=== RANDOM_SESSION_'+s+'_SUMMARY ===');
            console.log((await page.locator('body').innerText()).slice(0,10000));
          }
          console.log('\n=== RANDOM_STORAGE ===');
          console.log(await page.evaluate(()=>localStorage.getItem('golf-aim:priv:random10-sessions')));
          await browser.close();
          JS
          node qa.mjs
