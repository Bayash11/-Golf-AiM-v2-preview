name: QA Golf AiM
on:
  push:
    branches: [qa-golfaim-test]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright-core@1.55.0 >/dev/null 2>&1
      - name: Run diagnostic
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/設定/}).first().click();
          await page.waitForTimeout(300);
          console.log('=== SETTINGS ===');
          console.log((await page.locator('body').innerText()).slice(0,15000));
          console.log('BUTTONS',JSON.stringify(await page.locator('button').allInnerTexts()));
          console.log('INPUTS',JSON.stringify(await page.locator('input').evaluateAll(xs=>xs.map(x=>({type:x.type,value:x.value,placeholder:x.placeholder,checked:x.checked})))));
          await browser.close();
          JS
          node qa.mjs
