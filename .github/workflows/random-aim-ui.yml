name: GOLF AiM random aim UI checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/random-aim-ui.test.cjs'
      - '.github/workflows/random-aim-ui.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/random-aim-ui.test.cjs'
      - '.github/workflows/random-aim-ui.yml'

jobs:
  random-aim-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify random aim UI and course conditions
        run: node --test tests/random-aim-ui.test.cjs
