name: GOLF AiM save recovery tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/save-recovery.test.cjs'
      - '.github/workflows/save-recovery-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GOLF AiM save recovery
        run: node --test tests/save-recovery.test.cjs
